[project]
name = "my-project"
version = "0.0.0"
description = ""
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[project.scripts]
my-project = "my_project:main"

[build-system]
requires = ["uv_build>=0.10.11,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["black", "isort", "pytest", "ruff", "ty"]

[tool.black]
# Default config.

[tool.isort]
# The one setting that stops isort from rewriting black's output.
profile = "black"

[tool.ruff.lint]
select = ["E", "F", "B", "UP"]
# Black wraps long lines, and isort sorts imports.
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
